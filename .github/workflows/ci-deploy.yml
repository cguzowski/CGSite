name: CI and deploy

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: angular/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

      - name: Build production site
        run: npm run build

      - name: Verify static entry point
        run: test -f dist/angular/browser/index.html

      - name: Upload static site
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: cgsite-browser-${{ github.sha }}
          path: angular/dist/angular/browser
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build-and-test
    runs-on:
      - self-hosted
      - linux
      - cgsite-production
    environment: production
    steps:
      - name: Download verified static site
        uses: actions/download-artifact@v4
        with:
          name: cgsite-browser-${{ github.sha }}
          path: site

      - name: Deploy release atomically
        run: sudo /usr/local/sbin/deploy-cgsite "$GITHUB_WORKSPACE/site" "${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"

