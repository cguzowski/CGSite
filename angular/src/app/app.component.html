<a class="skip-link" href="#main-content">Skip to content</a>
<main id="main-content" tabindex="-1">
  <section id="home" class="section" aria-label="Home" tabindex="-1">
    @if (iosPlaybackBlocked) {
      <img class="home-background-fallback" src="assets/images/fuji-water-fallback.jpg" alt="" aria-hidden="true">
    }
    <video #backgroundVideo class="home-background" [class.ios-playback-blocked]="iosPlaybackBlocked" autoplay loop muted
      playsinline preload="metadata" aria-hidden="true" tabindex="-1"
      (loadedmetadata)="videoRatio = backgroundVideo.videoWidth / backgroundVideo.videoHeight; tryPlayHeroVideo(backgroundVideo)">
      <source src="videos/fuji-water-stabilized-vp9-download.webm" type="video/webm">
    </video>
    <app-home></app-home>
    <header class="site-header">
      <app-navbar></app-navbar>
    </header>
  </section>
  <section id="about" class="section" aria-labelledby="about-heading" tabindex="-1">
    <app-section-navigation section="about" title="About" />
    <app-about></app-about>
  </section>
  <section id="projects" class="section" aria-labelledby="projects-heading" tabindex="-1">
    <app-section-navigation section="projects" title="Projects" />
    <app-project></app-project>
  </section>
  <section id="contact" class="section" aria-labelledby="contact-heading" tabindex="-1">
    <app-section-navigation section="contact" title="Contact" />
    <div id="connect" tabindex="-1"><app-connect></app-connect></div>
  </section>
</main>
<footer class="site-footer">
  <p>Designed &amp; Built by Christopher Guzowski &copy; All Rights Reserved 2026</p>
</footer>
